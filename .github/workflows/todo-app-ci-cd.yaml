name: todo-app-ci-cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      skip-infra:
        description: "Skip infrastructure deployment"
        required: false
        default: false
        type: boolean

concurrency:
  group: todo-app-ci-cd-${{ github.ref_name }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  DEPLOYMENT_LOCATION: eastus

defaults:
  run:
    working-directory: Devops/todo-app

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.infra-outputs.outputs.acrName }}
      acr_login_server: ${{ steps.infra-outputs.outputs.acrLoginServer }}
      resource_group: ${{ steps.infra-outputs.outputs.resourceGroupName }}
      aks_cluster: ${{ steps.infra-outputs.outputs.aksClusterName }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infra
        id: deploy-infra
        if: ${{ github.event.inputs.skip-infra == 'false'}}
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          deploymentName: todo-app-${{ github.event.inputs.environment }}
          region: ${{ env.DEPLOYMENT_LOCATION }}
          template: Devops/todo-app/infra/bicep/main.bicep
          parameters: Devops/todo-app/infra/bicep/parameters/${{ github.event.inputs.environment }}.bicepparam
     
      - name: Get AKS credentials
        if: ${{ github.event.inputs.skip-infra == 'false' }}
        run: |
          az aks get-credentials --resource-group ${{ steps.deploy-infra.outputs.resourceGroupName }} --name ${{ steps.deploy-infra.outputs.aksClusterName  }} --overwrite-existing

      - name: Install NGINX Ingress Controller
        if: ${{ github.event.inputs.skip-infra == 'false' }}
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment }}

          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --values infra/charts/nginx-ingress/values.yaml \
            --values infra/charts/nginx-ingress/values-${ENVIRONMENT}.yaml \
            --wait \
            --timeout 5m
      
      - name: Get infra outputs
        id: infra-outputs
        run: |
          DEPLOYMENT_NAME=todo-app-${{ github.event.inputs.environment }}
          SKIP_INFRA=${{ github.event.inputs.skip-infra }}

          if [ "$SKIP_INFRA" = 'false' ]; then
            echo "acrName=${{ steps.deploy-infra.outputs.acrname }}" >> $GITHUB_OUTPUT
            echo "acrLoginServer=${{ steps.deploy-infra.outputs.acrloginserver }}" >> $GITHUB_OUTPUT
            echo "resourceGroupName=${{ steps.deploy-infra.outputs.resourcegroupname }}" >> $GITHUB_OUTPUT
            echo "aksClusterName=${{ steps.deploy-infra.outputs.aksclustername }}" >> $GITHUB_OUTPUT
          else
            echo "acrName=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query 'properties.outputs.acrName.value' -o tsv)" >> $GITHUB_OUTPUT
            echo "acrLoginServer=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query 'properties.outputs.acrLoginServer.value' -o tsv)" >> $GITHUB_OUTPUT
            echo "resourceGroupName=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query 'properties.outputs.resourceGroupName.value' -o tsv)" >> $GITHUB_OUTPUT
            echo "aksClusterName=$(az deployment sub show --name "$DEPLOYMENT_NAME" --query 'properties.outputs.aksClusterName.value' -o tsv)" >> $GITHUB_OUTPUT
          fi

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: deploy-infra
    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: set-image-tag
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment }}
          echo "image-tag=${ENVIRONMENT}-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ needs.deploy-infra.outputs.acr_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: Devops/todo-app/server
          push: true
          tags: ${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-server:${{ steps.set-image-tag.outputs.image-tag }}
          cache-from: type=registry,ref=${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-server:cache
          cache-to: type=registry,ref=${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-server:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: Devops/todo-app/client
          push: true
          tags: ${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-client:${{ steps.set-image-tag.outputs.image-tag }}
          cache-from: type=registry,ref=${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-client:cache
          cache-to: type=registry,ref=${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-client:cache,mode=max

  deploy-app:
    runs-on: ubuntu-latest
    needs: [deploy-infra, build-and-push-images]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ needs.deploy-infra.outputs.resource_group }} --name ${{ needs.deploy-infra.outputs.aks_cluster }} --overwrite-existing

      - name: Deploy Helm chart
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment }}
          HELM_VALUES=infra/charts/todo-app/values-${ENVIRONMENT}.yaml
          helm upgrade --install todo-app infra/charts/todo-app \
            --namespace todo-app \
            --create-namespace \
            --set global.environment=$ENVIRONMENT \
            --set backend.image.repository=${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-server \
            --set backend.image.tag=${{ needs.build-and-push-images.outputs.image_tag }} \
            --set frontend.image.repository=${{ needs.deploy-infra.outputs.acr_login_server }}/todo-app-client \
            --set frontend.image.tag=${{ needs.build-and-push-images.outputs.image_tag }} \
            --values $HELM_VALUES
