name: todo-app-infra-shared

on:
  workflow_dispatch:

concurrency:
  group: todo-app-infra-shared
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  DEPLOYMENT_LOCATION: eastus

defaults:
  run:
    working-directory: Devops/todo-app

jobs:

  deploy-shared-infra:
    name: "Infra · Shared"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy shared infra
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          deploymentName: todo-app-shared
          region: ${{ env.DEPLOYMENT_LOCATION }}
          template: Devops/todo-app/infra/bicep/main-shared.bicep
