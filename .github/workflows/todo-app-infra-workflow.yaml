name: todo-app-infra-workflow

on:
  workflow_dispatch:

concurrency:
  group: todo-app-infra-envs
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  DEPLOYMENT_LOCATION: eastus

defaults:
  run:
    working-directory: Devops/todo-app

jobs:

  deploy-dev-infra:
    name: "Infra · DEV"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get shared infra ACR ID
        id: acr
        run: |
          echo "acrId=$(az deployment sub show \
            --name 'todo-app-shared' \
            --query 'properties.outputs.acrId.value' \
            -o tsv)" >> $GITHUB_OUTPUT

      - name: Deploy DEV infra
        id: deploy-dev
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          deploymentName: todo-app-dev
          region: ${{ env.DEPLOYMENT_LOCATION }}
          template: Devops/todo-app/infra/bicep/main.bicep
          parameters: >
            Devops/todo-app/infra/bicep/parameters/dev.bicepparam
            sharedAcrId=${{ steps.acr.outputs.acrId }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ steps.deploy-dev.outputs.resourceGroupName }} \
            --name ${{ steps.deploy-dev.outputs.aksClusterName }} \
            --overwrite-existing

      - name: Install NGINX Ingress Controller (DEV)
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --values infra/charts/nginx-ingress/values.yaml \
            --values infra/charts/nginx-ingress/values-dev.yaml \
            --wait \
            --timeout 5m

      - name: Install cert-manager (DEV)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m

  deploy-prod-infra:
    name: "Infra · PROD"
    runs-on: ubuntu-latest
    needs: deploy-dev-infra
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get shared infra ACR ID
        id: acr
        run: |
          echo "acrId=$(az deployment sub show \
            --name 'todo-app-shared' \
            --query 'properties.outputs.acrId.value' \
            -o tsv)" >> $GITHUB_OUTPUT

      - name: Deploy PROD infra
        id: deploy-prod
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          deploymentName: todo-app-prod
          region: ${{ env.DEPLOYMENT_LOCATION }}
          template: Devops/todo-app/infra/bicep/main.bicep
          parameters: >
            Devops/todo-app/infra/bicep/parameters/prod.bicepparam
            sharedAcrId=${{ steps.acr.outputs.acrId }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ steps.deploy-prod.outputs.resourceGroupName }} \
            --name ${{ steps.deploy-prod.outputs.aksClusterName }} \
            --overwrite-existing

      - name: Install NGINX Ingress Controller (PROD)
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --values infra/charts/nginx-ingress/values.yaml \
            --values infra/charts/nginx-ingress/values-prod.yaml \
            --wait \
            --timeout 5m

      - name: Install cert-manager (PROD)
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m
