name: todo-app-pipeline

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - server/*
      - client/*

pr: none

variables:
  azureSubscription: 'AzureServiceConnection'

stages:
  - stage: BuildAndPush
    displayName: "Build & Push Images"
    jobs:
      - job: BuildAndPushJob
        displayName: "Build & Push Images"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              IMAGE_TAG="sha-$(Build.SourceVersion)"
              echo "##vso[task.setvariable variable=imageTag;isOutput=true]$IMAGE_TAG"
            name: setTag
            displayName: 'Set image tag'

          - task: AzureCLI@2
            name: acr
            displayName: 'Get ACR details & Build/Push Docker images'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                ACR_NAME=$(az deployment sub show \
                  --name 'todo-app-shared' \
                  --query 'properties.outputs.acrName.value' \
                  -o tsv)
                ACR_LOGIN_SERVER=$(az deployment sub show \
                  --name 'todo-app-shared' \
                  --query 'properties.outputs.acrLoginServer.value' \
                  -o tsv)
                
                echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$ACR_LOGIN_SERVER"
                
                az acr login --name "$ACR_NAME"
                
                docker buildkit setup --use || true
                docker build -t "$ACR_LOGIN_SERVER/todo-app-server:$(setTag.imageTag)" ./server
                docker push "$ACR_LOGIN_SERVER/todo-app-server:$(setTag.imageTag)"
                
                docker build -t "$ACR_LOGIN_SERVER/todo-app-client:$(setTag.imageTag)" ./client
                docker push "$ACR_LOGIN_SERVER/todo-app-client:$(setTag.imageTag)"

  - stage: DeployDevApp
    displayName: "Deploy · DEV"
    dependsOn: BuildAndPush
    variables:
      imageTag: $[ stageDependencies.BuildAndPush.BuildAndPushJob.outputs['setTag.imageTag'] ]
      acrLoginServer: $[ stageDependencies.BuildAndPush.BuildAndPushJob.outputs['acr.acrLoginServer'] ]
    jobs:
      - deployment: DeployDevAppJob
        displayName: "Deploy · DEV"
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Get DEV AKS credentials & Deploy Helm chart'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      RESOURCE_GROUP=$(az deployment sub show \
                        --name 'todo-app-dev' \
                        --query 'properties.outputs.resourceGroupName.value' \
                        -o tsv)
                      AKS_CLUSTER=$(az deployment sub show \
                        --name 'todo-app-dev' \
                        --query 'properties.outputs.aksClusterName.value' \
                        -o tsv)
                      
                      az aks get-credentials \
                        --resource-group "$RESOURCE_GROUP" \
                        --name "$AKS_CLUSTER" \
                        --overwrite-existing
                      
                      helm upgrade --install todo-app infra/charts/todo-app \
                        --namespace todo-app \
                        --create-namespace \
                        --set global.environment=dev \
                        --set backend.image.repository="$(acrLoginServer)/todo-app-server" \
                        --set backend.image.tag="$(imageTag)" \
                        --set frontend.image.repository="$(acrLoginServer)/todo-app-client" \
                        --set frontend.image.tag="$(imageTag)" \
                        --values infra/charts/todo-app/values-dev.yaml \
                        --wait \
                        --timeout 5m

  - stage: DeployProdApp
    displayName: "Deploy · PROD"
    dependsOn:
      - BuildAndPush
      - DeployDevApp
    variables:
      imageTag: $[ stageDependencies.BuildAndPush.BuildAndPushJob.outputs['setTag.imageTag'] ]
      acrLoginServer: $[ stageDependencies.BuildAndPush.BuildAndPushJob.outputs['acr.acrLoginServer'] ]
    jobs:
      - deployment: DeployProdAppJob
        displayName: "Deploy · PROD"
        environment: 'prod'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Get PROD AKS credentials & Deploy Helm chart'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      RESOURCE_GROUP=$(az deployment sub show \
                        --name 'todo-app-prod' \
                        --query 'properties.outputs.resourceGroupName.value' \
                        -o tsv)
                      AKS_CLUSTER=$(az deployment sub show \
                        --name 'todo-app-prod' \
                        --query 'properties.outputs.aksClusterName.value' \
                        -o tsv)
                      
                      az aks get-credentials \
                        --resource-group "$RESOURCE_GROUP" \
                        --name "$AKS_CLUSTER" \
                        --overwrite-existing
                      
                      helm upgrade --install todo-app infra/charts/todo-app \
                        --namespace todo-app \
                        --create-namespace \
                        --set global.environment=prod \
                        --set backend.image.repository="$(acrLoginServer)/todo-app-server" \
                        --set backend.image.tag="$(imageTag)" \
                        --set frontend.image.repository="$(acrLoginServer)/todo-app-client" \
                        --set frontend.image.tag="$(imageTag)" \
                        --values infra/charts/todo-app/values-prod.yaml \
                        --wait \
                        --timeout 5m
