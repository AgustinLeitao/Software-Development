global:
  environment: dev

backend:
  replicaCount: 1
  image:
    repository: myacr.azurecr.io/todo-app-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 4000
  resources: {}
  env:
    corsOrigin: "*"

frontend:
  replicaCount: 1
  image:
    repository: myacr.azurecr.io/todo-app-client
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources: {}

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: todo-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
