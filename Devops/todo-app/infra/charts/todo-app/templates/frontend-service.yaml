apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.fullname" . }}-frontend
  labels:
    app: {{ include "todo-app.fullname" . }}
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: {{ include "todo-app.fullname" . }}
    component: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
