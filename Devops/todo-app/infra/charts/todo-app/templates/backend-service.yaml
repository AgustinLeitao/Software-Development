apiVersion: v1
kind: Service
metadata:
  name: '{{ include "todo-app.fullname" . }}-backend'
  labels:
    app: {{ include "todo-app.fullname" . }}
    component: backend
spec:
  type: ClusterIP
  selector:
    app: {{ include "todo-app.fullname" . }}
    component: backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
      name: http
