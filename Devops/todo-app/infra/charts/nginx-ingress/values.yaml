controller:
  replicaCount: 1

  service:
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-protocol: tcp
    externalTrafficPolicy: Local

  config:
    use-forwarded-headers: "true"
    use-proxy-protocol: "false"

  healthCheckPath: /healthz

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector:
    kubernetes.io/os: linux

  admissionWebhooks:
    enabled: true

defaultBackend:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux
