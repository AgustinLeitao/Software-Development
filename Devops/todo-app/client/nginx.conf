server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA: serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the HTML entry point so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets can be cached aggressively (Vite includes content hash in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
