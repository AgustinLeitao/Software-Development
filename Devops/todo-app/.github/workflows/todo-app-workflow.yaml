name: todo-app-workflow

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:

  build-and-push:
    name: "Build & Push Images"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image-tag }}
      acr_login_server: ${{ steps.acr.outputs.acrLoginServer }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "image-tag=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR details from shared infra deployment
        id: acr
        run: |
          echo "acrName=$(az deployment sub show \
            --name 'todo-app-shared' \
            --query 'properties.outputs.acrName.value' \
            -o tsv)" >> $GITHUB_OUTPUT
          echo "acrLoginServer=$(az deployment sub show \
            --name 'todo-app-shared' \
            --query 'properties.outputs.acrLoginServer.value' \
            -o tsv)" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        run: az acr login --name ${{ steps.acr.outputs.acrName }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.acr.outputs.acrLoginServer }}/todo-app-server:${{ steps.set-tag.outputs.image-tag }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.acrLoginServer }}/todo-app-server:cache
          cache-to: type=registry,ref=${{ steps.acr.outputs.acrLoginServer }}/todo-app-server:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.acr.outputs.acrLoginServer }}/todo-app-client:${{ steps.set-tag.outputs.image-tag }}
          cache-from: type=registry,ref=${{ steps.acr.outputs.acrLoginServer }}/todo-app-client:cache
          cache-to: type=registry,ref=${{ steps.acr.outputs.acrLoginServer }}/todo-app-client:cache,mode=max

  deploy-dev-app:
    name: "Deploy · DEV"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get DEV AKS credentials
        run: |
          RESOURCE_GROUP=$(az deployment sub show \
            --name 'todo-app-dev' \
            --query 'properties.outputs.resourceGroupName.value' \
            -o tsv)
          AKS_CLUSTER=$(az deployment sub show \
            --name 'todo-app-dev' \
            --query 'properties.outputs.aksClusterName.value' \
            -o tsv)
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Deploy Helm chart to DEV
        run: |
          helm upgrade --install todo-app infra/charts/todo-app \
            --namespace todo-app \
            --create-namespace \
            --set global.environment=dev \
            --set backend.image.repository=${{ needs.build-and-push.outputs.acr_login_server }}/todo-app-server \
            --set backend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set frontend.image.repository=${{ needs.build-and-push.outputs.acr_login_server }}/todo-app-client \
            --set frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --values infra/charts/todo-app/values-dev.yaml \
            --wait \
            --timeout 5m

  deploy-prod-app:
    name: "Deploy · PROD"
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-dev-app]
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get PROD AKS credentials
        run: |
          RESOURCE_GROUP=$(az deployment sub show \
            --name 'todo-app-prod' \
            --query 'properties.outputs.resourceGroupName.value' \
            -o tsv)
          AKS_CLUSTER=$(az deployment sub show \
            --name 'todo-app-prod' \
            --query 'properties.outputs.aksClusterName.value' \
            -o tsv)
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Deploy Helm chart to PROD
        run: |
          # Same image tag promoted from DEV — this is the promotion guarantee
          helm upgrade --install todo-app infra/charts/todo-app \
            --namespace todo-app \
            --create-namespace \
            --set global.environment=prod \
            --set backend.image.repository=${{ needs.build-and-push.outputs.acr_login_server }}/todo-app-server \
            --set backend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set frontend.image.repository=${{ needs.build-and-push.outputs.acr_login_server }}/todo-app-client \
            --set frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --values infra/charts/todo-app/values-prod.yaml \
            --wait \
            --timeout 5m
