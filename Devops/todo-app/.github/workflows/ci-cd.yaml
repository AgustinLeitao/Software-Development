name: todoapp-ci-cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

env:
  DEPLOYMENT_LOCATION: eastus

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.bicep-deploy.outputs.acr_name }}
      resource_group: ${{ steps.bicep-deploy.outputs.resource_group }}
      aks_cluster: ${{ steps.bicep-deploy.outputs.aks_cluster }}
      environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infra with Bicep
        id: bicep-deploy
        run: |
          DEPLOYMENT_OUTPUT=$(az deployment subscription create \
            --location ${{ env.DEPLOYMENT_LOCATION }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/${{ github.event.inputs.environment }}.bicepparam \
            --query '{acrLoginServer: outputs.acrLoginServer.value, acrName: outputs.acrName.value, resourceGroup: outputs.resourceGroupName.value, aksCluster: outputs.aksClusterName.value}' \
            -o json)
          
          ACR_LOGIN_SERVER=$(echo $DEPLOYMENT_OUTPUT | jq -r '.acrLoginServer' 2>/dev/null)
          ACR_NAME=$(echo $DEPLOYMENT_OUTPUT | jq -r '.acrName' 2>/dev/null)
          RESOURCE_GROUP=$(echo $DEPLOYMENT_OUTPUT | jq -r '.resourceGroup' 2>/dev/null)
          AKS_CLUSTER=$(echo $DEPLOYMENT_OUTPUT | jq -r '.aksCluster' 2>/dev/null)
          
          if [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$ACR_NAME" ] || [ -z "$RESOURCE_GROUP" ] || [ -z "$AKS_CLUSTER" ]; then
            echo "Error: Failed to extract outputs from Bicep deployment"
            echo "Output was: $DEPLOYMENT_OUTPUT"
            exit 1
          fi
          
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "aks_cluster=$AKS_CLUSTER" >> $GITHUB_OUTPUT
  build-push-deploy:
    runs-on: ubuntu-latest
    needs: infra
    environment: ${{ needs.infra.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          ENVIRONMENT=${{ needs.infra.outputs.environment }}
          echo "image-tag=${ENVIRONMENT}-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ needs.infra.outputs.acr_name }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ needs.infra.outputs.acr_login_server }}/todo-app-server:${{ steps.set-tag.outputs.image-tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ needs.infra.outputs.acr_login_server }}/todo-app-client:${{ steps.set-tag.outputs.image-tag }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ needs.infra.outputs.resource_group }} --name ${{ needs.infra.outputs.aks_cluster }} --overwrite-existing

      - name: Deploy Helm chart
        run: |
          ENVIRONMENT=${{ needs.infra.outputs.environment }}
          HELM_VALUES=infra/charts/todo-app/values-${ENVIRONMENT}.yaml
          helm upgrade --install todo-app infra/charts/todo-app \
            --namespace todo-app \
            --create-namespace \
            --set global.environment=$ENVIRONMENT \
            --set backend.image.repository=${{ needs.infra.outputs.acr_login_server }}/todo-app-server \
            --set backend.image.tag=${{ steps.set-tag.outputs.image-tag }} \
            --set frontend.image.repository=${{ needs.infra.outputs.acr_login_server }}/todo-app-client \
            --set frontend.image.tag=${{ steps.set-tag.outputs.image-tag }} \
            --values $HELM_VALUES
